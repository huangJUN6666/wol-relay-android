name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # 中继是纯 Go 静态编译，任何机器上都能出结果，适合先跑这个
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 编译模块 zip
        run: |
          chmod +x scripts/build-module.sh
          GO=go ARCHS="arm64 arm" bash scripts/build-module.sh

      - uses: actions/upload-artifact@v4
        with:
          name: module
          path: dist/*.zip

  # APK 需要 SDK，放在单独 job 里，失败了不影响模块产物
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # 签名密钥不放在仓库里，用 Secret 存一份 base64 传进来。
      # 如果没有配 Secret，就临时生成一把 —— 能出包，但每次签名都不同，
      # 用户无法覆盖安装。正式发版请务必配好 KEYSTORE_B64。
      - name: 准备签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p android/app/keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/keystore/wol.jks
            echo "已从 Secret 还原签名密钥"
          else
            echo "::warning::没有配置 KEYSTORE_B64，本次用临时密钥签名，产物不能覆盖安装旧版本"
          fi

      - name: 写 build.env
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls "$SDK_ROOT/build-tools" | sort -V | tail -1)
          cat > build.env <<EOF
          SDK=$SDK_ROOT
          BUILD_TOOLS_VERSION=$BT
          JDK=$JAVA_HOME
          KEYSTORE_PASS=${KS_PASS:-ci-temporary-pass}
          KEY_ALIAS=wol
          EOF

      - name: 编译 APK
        run: |
          chmod +x scripts/build-apk.sh
          bash scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  release:
    needs: [relay, apk]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # 产物名字里直接带方案类型，下载的人一眼知道自己在拿哪个
          files: |
            dist/wol-relay-*.zip
            dist/*.apk
          body: |
            ## 下载哪个

            | 文件 | 方案 | 需要 root | 说明 |
            |---|---|---|---|
            | `wol-relay-${{ github.ref_name }}.zip` | **Root 版** | 是 | Magisk / KernelSU / APatch 模块，装到闲置安卓机上当中继 |
            | `远程开机.apk` | 客户端 | 否 | 装在你自己手机上，用来触发唤醒。**不装也行**，浏览器直接开中继地址同样能用 |

            **Root 版**是主力方案：模块由 `magiskd` 以 root 身份常驻，不受系统省电策略影响，进程挂了会自动拉起。

            没有 root 的机器看 [docs/05-没有root怎么办.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/05-没有root怎么办.md)，里面有 Termux 方案，但要接受它会被系统清后台。

            ## 装之前先确认三件事

            1. 电脑是**有线网卡**（WiFi 网卡关机后断电，唤不醒）—— [docs/06-适合哪些设备.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/06-适合哪些设备.md)
            2. BIOS 里开了网络唤醒，并且关了 `ErP` / `EuP` —— [docs/01-电脑端设置.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/01-电脑端设置.md)
            3. Windows 的快速启动关了（`powercfg /h off`）

            三条缺一条，后面怎么配都没用。

            ## 刷完改 MAC

            配置在 `/data/adb/wol-relay/config.json`，不是模块目录里。
            这么放是因为 Magisk 升级模块会把模块目录整个换掉，配置放里面会丢。

            ```bash
            su -c 'vi /data/adb/wol-relay/config.json'
            # 把 mac 改成你要唤醒的那台电脑的网卡地址
            ```

            改完重启，然后跑自检：

            ```bash
            su -c 'sh /data/adb/modules/wol-relay/doctor.sh'
            ```

            输出里第一个 `[X]` 就是卡住的地方。

            完整变更见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)。
