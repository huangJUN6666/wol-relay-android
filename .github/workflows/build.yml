name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # 版本号校验放最前面，而且是最轻的一步（只跑 bash，不装任何东西）。
  # v2.1.0 那次就是五处版本号漏改一处，App 误判中继过旧、
  # 让用户去升级一个根本不用升级的东西。这种错跑十几分钟 CI 才发现太亏，
  # 所以让 relay / apk 都 dependsOn 它，不一致就直接全挂。
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 五处版本号是否一致
        run: bash scripts/check-version.sh

  # 中继是纯 Go 静态编译，任何机器上都能出结果，适合先跑这个
  relay:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 编译模块 zip
        run: |
          chmod +x scripts/build-module.sh
          GO=go ARCHS="arm64 arm" bash scripts/build-module.sh

      # ---- 免 root 版：给路由器 / NAS / 树莓派 / 旧笔记本用的裸二进制 ----
      #
      # 这一段是"受众数量级差别"的来源。原来只有 Magisk 模块，用的人必须
      # 有一台 root 过的安卓机。而中继本质上只是个 30KB 的静态二进制，
      # 换任何一个常开的 Linux 都能跑 —— 门槛是发布方式造成的，不是技术造成的。
      #
      # 覆盖到的架构说明：
      #   amd64   —— 任何 PC / 服务器 / 群晖 x86 机型 / Docker
      #   arm64   —— 树莓派 3/4/5、多数 ARM NAS、电视盒子、arm64 路由
      #   armv7   —— 树莓派 2、老式 ARM NAS
      #   armv6   —— 树莓派 1 / Zero（存量很大，很多人在拿它做小服务）
      #   386     —— 极老的 x86 设备
      #   mipsle  —— 大量家用路由器（MT7621 之类）是 mipsle
      #   mips    —— 另一批路由器（大端）
      # 每个多几行 YAML，换来的是"有任意一台常开 Linux 设备就能用"。
      - name: 编译免 root 版多架构二进制
        run: |
          set -e
          mkdir -p dist/native
          cd relay
          # GOARM/GOAMD64 都是默认值，不额外调 —— 调高了反而在老设备上跑不起来
          for t in \
              amd64:amd64 \
              arm64:arm64 \
              armv7:arm \
              armv6:arm \
              "386:386" \
              mipsle:mipsle \
              mips:mips
          do
            name="${t%%:*}"
            goarch="${t##*:}"
            extra=""
            [ "$name" = armv7 ] && extra="GOARM=7"
            [ "$name" = armv6 ] && extra="GOARM=6"
            echo "--- linux/$name"
            env GOOS=linux GOARCH="$goarch" $extra CGO_ENABLED=0 \
              go build -trimpath -tags netgo,osusergo -ldflags "-s -w" \
              -o "../dist/native/wolrelay-linux-$name" .
          done
          ls -lh ../dist/native/

      # 校验和不是形式主义：用户会 `curl | sh`，拷到路由器上跑。
      # 没有 SHA256 的话，下错了架构只会看到 "Exec format error"，
      # 而这个脚本会先跑一次 -version 来确认能执行，两者配合才能定位问题。
      - name: 生成校验和
        run: |
          cd dist/native
          sha256sum wolrelay-linux-* > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: module
          path: dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: dist/native/*

  # APK 需要 SDK，放在单独 job 里，失败了不影响模块产物
  apk:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 自带 Android SDK，不必再装 setup-android 这个 action。
      # 原来那步会去下载 cmdline-tools，经常超时或 429，直接把整个 job 拖挂，
      # 连带 release job 被 skip。
      - name: 确认 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          ls "$SDK/build-tools" "$SDK/platforms"

      # 签名密钥不放在仓库里，用 Secret 存一份 base64 传进来。
      # 如果没有配 Secret，就临时生成一把 —— 能出包，但每次签名都不同，
      # 用户无法覆盖安装。正式发版请务必配好 KEYSTORE_B64。
      - name: 准备签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p android/app/keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/keystore/wol.jks
            echo "已从 Secret 还原签名密钥"
          else
            echo "::warning::没有配置 KEYSTORE_B64，本次用临时密钥签名，产物不能覆盖安装旧版本"
          fi

      - name: 写 build.env
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls "$SDK_ROOT/build-tools" | sort -V | tail -1)
          # 用逐行 echo，不用 heredoc：YAML 里的缩进会被原样写进文件，
          # build.env 每行带前导空格的话，脚本 source 时会当成命令执行并报
          # "SDK=...: command not found"。
          : > build.env
          echo "SDK=$SDK_ROOT"                >> build.env
          echo "BUILD_TOOLS_VERSION=$BT"      >> build.env
          echo "JDK=$JAVA_HOME"               >> build.env
          echo "KEYSTORE_PASS=${KS_PASS:-ci-temporary-pass}" >> build.env
          echo "KEY_ALIAS=wol"                >> build.env
          echo "--- build.env ---"
          cat build.env

      - name: 编译 APK
        run: |
          chmod +x scripts/build-apk.sh
          bash scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  release:
    needs: [guard, relay, apk]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 不要用 merge-multiple: true。
      # 它会把每个 artifact 的内容平铺进 dist/ 根目录，native/ 这一层被抹掉，
      # 于是下面 files: 里写的 dist/native/... 全部匹配不到。
      # softprops/action-gh-release 对匹配不到的通配符不报错，只是悄悄不上传 ——
      # v2.2.0 首发就是这样：Release 里只有 zip 和 apk，
      # 七个裸二进制一个都没进去，而 CI 显示四个 job 全绿。
      # 现在按 artifact 名分目录：dist/module、dist/native、dist/apk。
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # 少传一个文件就给个红叉，别等发完才发现下载页少东西
      - name: 确认产物齐全
        run: |
          set -e
          echo "=== dist 树 ==="
          find dist -type f -printf '%10s  %p\n' | sort -k2
          n=$(ls dist/native/wolrelay-linux-* 2>/dev/null | wc -l)
          echo "裸二进制：$n 个"
          [ "$n" -eq 7 ] || { echo "::error::应该有 7 个裸二进制，实际 $n 个"; exit 1; }
          test -f dist/native/SHA256SUMS || { echo "::error::缺 SHA256SUMS"; exit 1; }
          ls dist/module/*.zip >/dev/null || { echo "::error::缺模块 zip"; exit 1; }
          ls dist/apk/*.apk  >/dev/null || { echo "::error::缺 APK"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          # 产物名字里直接带方案类型，下载的人一眼知道自己在拿哪个
          files: |
            dist/module/*.zip
            dist/native/wolrelay-linux-*
            dist/native/SHA256SUMS
            dist/apk/*.apk
          body: |
            ## 下载哪个

            三种装法，按你的设备挑一个：

            | 文件 | 方案 | 需要 root | 说明 |
            |---|---|---|---|
            | `wol-relay-${{ github.ref_name }}.zip` | **Magisk 模块** | 是 | 装在闲置安卓机上。进程挂了自动拉起，最省心 |
            | `wolrelay-linux-*` | **裸二进制** | **否** | 装在路由器 / NAS / 树莓派 / 旧笔记本上。`curl \| sh` 一键装 |
            | `WOL-Relay-App-*.apk` | 客户端 | 否 | 装在你自己手机上触发唤醒。**不装也行**，浏览器直接开中继地址同样能用 |

            ---

            ### 没有 root 的机器用这个（推荐大多数人）

            只要有一台常开的 Linux 设备就行 —— 路由器、NAS、树莓派、旧笔记本、Docker 宿主机。
            一条命令，装完自动配好开机自启（systemd / OpenWrt procd / SysV 都会自动识别）：

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/install.sh | sudo sh
            ```

            想先看看它会做什么，加 `--dry-run`：

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/install.sh | sudo sh -s -- --dry-run
            ```

            选哪个架构：

            | 文件 | 适合 |
            |---|---|
            | `wolrelay-linux-amd64` | 任何 PC / 服务器 / 群晖 x86 / Docker |
            | `wolrelay-linux-arm64` | 树莓派 3/4/5、多数 ARM NAS、电视盒子 |
            | `wolrelay-linux-armv7` | 树莓派 2、老式 ARM NAS |
            | `wolrelay-linux-armv6` | 树莓派 1 / Zero |
            | `wolrelay-linux-mipsle` | 大量家用路由器（MT7621 等） |
            | `wolrelay-linux-mips` | 另一批（大端）路由器 |
            | `wolrelay-linux-386` | 很老的 x86 |

            不知道自己是哪个：`uname -m`，然后按 `x86_64→amd64`、`aarch64→arm64`、
            `armv7l→armv7` 对一下。装脚本会自动识别，一般不用管。

            ---

            **技术上是标准 UDP 魔术包（102 字节），没有用 raw socket、不做抓包**——写清楚免得误会。
            唤醒确认用的是 TCP 探测（445/3389/22/80/443）而不是 ping，原因同上：ICMP 要 raw socket，
            非 root 跑不了。

            ## 装之前先确认三件事

            1. 电脑是**有线网卡**（WiFi 网卡关机后断电，唤不醒）—— [docs/06-适合哪些设备.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/06-适合哪些设备.md)
            2. BIOS 里开了网络唤醒，并且关了 `ErP` / `EuP` —— [docs/01-电脑端设置.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/01-电脑端设置.md)
            3. Windows 的快速启动关了（`powercfg /h off`）

            三条缺一条，后面怎么配都没用。

            ## 改 MAC

            **Magisk 模块**的配置在 `/data/adb/wol-relay/config.json`，不是模块目录里。
            这么放是因为 Magisk 升级模块会把模块目录整个换掉，配置放里面会丢。

            ```bash
            su -c 'vi /data/adb/wol-relay/config.json'
            ```

            **免 root 版**的配置在 `/etc/wolrelay/config.json`：

            ```bash
            sudo vi /etc/wolrelay/config.json
            sudo systemctl restart wolrelay     # OpenWrt 用 /etc/init.d/wolrelay restart
            ```

            现在支持多台设备了，`devices` 是个数组：

            ```json
            {"devices": [
              {"name": "pc",  "mac": "AA:BB:CC:DD:EE:FF"},
              {"name": "nas", "mac": "11:22:33:44:55:66"}
            ]}
            ```

            之后 `http://中继地址:8080/wake?name=nas` 就能单独开某台。

            改完跑自检，输出里第一个 `[X]` 就是卡住的地方：

            ```bash
            sudo /opt/wolrelay/wolrelay -config /etc/wolrelay/config.json -doctor
            ```

            完整变更见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)。
